[package]
name = "venue-guide-ietf"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "An unofficial guide to an IETF meeting venue, as an MCP server announced over mDNS/DNS-SD"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4.43", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
gethostname = "1.1.0"
if-addrs = "0.15.0"
mdns-sd = "0.21.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "=3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# The mDNSResponder backend, which the mdnsresponder feature selects.
[target.'cfg(target_os = "macos")'.dependencies]
async-dnssd = { version = "0.5.1", optional = true }
futures-util = { version = "0.3.34", optional = true, default-features = false }

[features]
# Announces through mDNSResponder, the system's responder, with its dns_sd
# API, instead of with mdns-sd, a responder of the guide's own: macOS only.
mdnsresponder = ["dep:async-dnssd", "dep:futures-util", "tokio/time"]

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
